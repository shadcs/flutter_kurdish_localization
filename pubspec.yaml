name: kurdish_localization_plus
description: Flutter Kurdish Localization supporting both Central Kurdish (Sorani/CKB) and Kurmanji (KRM) dialects with comprehensive Material, Widget, and Cupertino localizations.
version: 1.2.0
homepage: https://github.com/shadcs/flutter_kurdish_localization
license: MIT

environment:
  sdk: '>=3.4.3 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
